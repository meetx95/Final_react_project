<html>
  <head>
    <title>Player</title>
  </head>

  <body>
    <div class="player">
      <div class="song">
        <h2>Lovers Rock</h2>
        <p>TV Girl</p>
      </div>
      <div class="controls">
        <button id="btn_play" onclick="play_pause()">Play</button>
      </div>

      <input
        id="time"
        type="range"
        min="0"
        max="100"
        value="0"
        oninput="seektime(this.value)"
      />

      <audio id="audio" src="LoversRock.mp3"></audio>
      <!-- <audio id="audio" src="IntoIt.mp3"></audio> -->
      <!-- <audio id="audio" src="LanaXArcticMonkeys.mp3"></audio> -->
      <!-- <audio id="audio" src="MothToAFlame.mp3"></`audio> -->
      <!-- <audio id="audio" src="Hotelroom.mp3"></audio> -->
      <!-- <audio id="audio" src="Snowman.mp3"></audio> -->
    </div>

    <script>
      const audio = document.getElementById("audio");
      const btn_play = document.getElementById("btn_play");
      const time = document.getElementById("time");

      function play_pause() {
        if (audio.paused) {
          audio.play().then(() => {
            btn_play.textContent = "Pause";
          });
        } else {
          audio.pause();
          btn_play.textContent = "Play";
        }
      }

      audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
          time.value = (audio.currentTime / audio.duration) * 100;
        }
      });

      audio.addEventListener("ended", () => {
        btn_play.textContent = "Play";
        time.value = 0;
      });

      function seektime(value) {
        if (audio.duration) {
          audio.currentTime = (value / 100) * audio.duration;
        }
      }
    </script>
  </body>
  <style>
    body {
      background-color: #071009;
    }
    .player {
      color: #fff;
      font-family: "Arial Black";
      width: 50%;
      width: 90%;
      background: #15151f;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #2a2a38;
    }
    .song {
      margin-bottom: 20px;
    }
    .song h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }
    .song p {
      color: #888;
      font-size: 14px;
    }
    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    #btn_play {
      border: none;
      background: #8df59a;
      color: #071009;
      padding: 10px 24px;
      border-radius: 25px;
    }
    #time {
      width: 100%;
      accent-color: #8df59a;
      cursor: pointer;
    }
  </style>
</html>
